<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            gap: 20px;
            height: 85vh;
            min-height: 500px;
        }

        .room-sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .room-sidebar h2 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .create-room-form {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .create-room-form input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .create-room-form input:focus {
            border-color: #00d4ff;
        }

        .create-room-form button {
            padding: 8px 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .room-item {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .room-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .room-item.active {
            background: rgba(0, 212, 255, 0.15);
            border-color: #00d4ff;
        }

        .room-item-name {
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .room-item-users {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .chat-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #00ff88; }
            50% { opacity: 0.5; box-shadow: 0 0 20px #00ff88; }
        }

        .chat-header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .current-room {
            margin-left: auto;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            background: rgba(0, 212, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .chat-main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chat-messages-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-nickname {
            color: #00d4ff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .message-nickname:hover {
            color: #00ff88;
            text-decoration: underline;
        }

        .message-time {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 8px;
            color: #e0e0e0;
            line-height: 1.6;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }

        .private-message .message-content {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .private-badge {
            color: #ffc107;
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(255, 193, 7, 0.1);
            border-radius: 10px;
            margin-left: 8px;
        }

        .users-sidebar {
            width: 200px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .users-sidebar h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .user-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
        }

        .user-name {
            color: #fff;
            font-size: 14px;
        }

        .chat-input-container {
            padding: 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .nickname-input {
            width: 150px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .nickname-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .nickname-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .status-bar {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-align: center;
        }

        .status-bar.connected {
            color: #00ff88;
        }

        .status-bar.disconnected {
            color: #ff6b6b;
        }

        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .welcome-modal {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .welcome-modal h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .welcome-modal p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .welcome-input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        .welcome-input:focus {
            border-color: #00d4ff;
        }

        .enter-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .room-list::-webkit-scrollbar,
        .user-list::-webkit-scrollbar {
            width: 4px;
        }

        .room-list::-webkit-scrollbar-track,
        .user-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .room-list::-webkit-scrollbar-thumb,
        .user-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-modal">
            <h2>欢迎来到聊天室</h2>
            <p>请输入您的昵称开始聊天</p>
            <input type="text" class="welcome-input" id="welcomeNickname" placeholder="输入昵称..." maxlength="20">
            <button class="enter-button" id="enterButton">进入聊天室</button>
        </div>
    </div>

    <div class="app-container">
        <div class="room-sidebar">
            <h2>房间列表</h2>
            <div class="create-room-form">
                <input type="text" id="newRoomName" placeholder="新房间名称" maxlength="30">
                <button id="createRoomBtn">创建</button>
            </div>
            <div class="room-list" id="roomList">
                {% for room in rooms %}
                <div class="room-item" data-room="{{ room.name }}">
                    <div class="room-item-name">{{ room.name }}</div>
                    <div class="room-item-users" id="users-{{ room.name }}">0 人在线</div>
                </div>
                {% endfor %}
            </div>
            
            <h2 style="margin-top: 20px;">私人聊天</h2>
            <div class="room-list" id="privateRoomList">
                <div style="color: rgba(255,255,255,0.5); text-align: center; padding: 20px; font-size: 13px;">
                    暂无私人聊天
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="status-dot"></div>
                <h1>实时聊天室</h1>
                <div class="current-room" id="currentRoom">未选择房间</div>
            </div>
            <div class="chat-main">
                <div class="chat-messages-wrapper">
                    <div class="chat-messages" id="chatMessages">
                        <div style="color: rgba(255,255,255,0.5); text-align: center; padding: 40px;">
                            请选择一个房间开始聊天
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <div class="input-group">
                            <input type="text" class="nickname-input" id="nickname" placeholder="昵称" maxlength="20" readonly>
                            <input type="text" class="message-input" id="messageInput" placeholder="输入消息... 点击用户名可@对方" maxlength="500" disabled>
                            <button class="send-button" id="sendButton" disabled>发送</button>
                        </div>
                        <div class="status-bar" id="statusBar">请先输入昵称</div>
                    </div>
                </div>
                <div class="users-sidebar">
                    <h3>在线用户</h3>
                    <div class="user-list" id="userList">
                        <div style="color: rgba(255,255,255,0.4); text-align: center; padding: 20px; font-size: 13px;">
                            请先进入房间
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentRoom = null;
        let currentNickname = null;
        let reconnectAttempts = 0;
        let maxReconnectAttempts = 10;
        let reconnectDelay = 1000;
        let reconnectTimeout = null;
        let isManualClose = false;

        const welcomeScreen = document.getElementById('welcomeScreen');
        const welcomeNickname = document.getElementById('welcomeNickname');
        const enterButton = document.getElementById('enterButton');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const nicknameInput = document.getElementById('nickname');
        const sendButton = document.getElementById('sendButton');
        const statusBar = document.getElementById('statusBar');
        const currentRoomEl = document.getElementById('currentRoom');
        const roomList = document.getElementById('roomList');
        const userList = document.getElementById('userList');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const newRoomName = document.getElementById('newRoomName');

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.getFullYear() + '-' +
                   String(date.getMonth() + 1).padStart(2, '0') + '-' +
                   String(date.getDate()).padStart(2, '0') + ' ' +
                   String(date.getHours()).padStart(2, '0') + ':' +
                   String(date.getMinutes()).padStart(2, '0') + ':' +
                   String(date.getSeconds()).padStart(2, '0');
        }

        function addMessage(nickname, content, timestamp, isPrivate = false, targetNickname = null) {
            const messageDiv = document.createElement('div');
            let showPrivateStyle = isPrivate && currentRoom && !currentRoom.startsWith('private:');
            messageDiv.className = 'message' + (showPrivateStyle ? ' private-message' : '');
            let privateBadge = '';
            if (showPrivateStyle) {
                privateBadge = `<span class="private-badge">私信 @${targetNickname}</span>`;
            }
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="message-nickname" onclick="mentionUser('${nickname}')">${nickname}</span>
                    <span class="message-time">${formatTime(timestamp)}</span>
                    ${privateBadge}
                </div>
                <div class="message-content">${content}</div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function mentionUser(nickname) {
            if (nickname === currentNickname) return;
            messageInput.value = `@${nickname} `;
            messageInput.focus();
        }

        function stopReconnect() {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
        }

        function reconnect() {
            if (reconnectTimeout) {
                return;
            }
            
            if (reconnectAttempts >= maxReconnectAttempts) {
                statusBar.textContent = '连接失败，请刷新页面重试';
                return;
            }
            
            reconnectAttempts++;
            statusBar.textContent = `正在重连... (${reconnectAttempts}/${maxReconnectAttempts})`;
            
            reconnectTimeout = setTimeout(() => {
                reconnectTimeout = null;
                if (currentRoom && currentNickname) {
                    connectToRoom(currentRoom, currentNickname, true);
                }
            }, reconnectDelay);
        }

        function connectToRoom(room, nickname, isReconnect = false) {
            stopReconnect();
            
            if (ws) {
                isManualClose = true;
                ws.close();
                isManualClose = false;
            }

            if (!isReconnect) {
                reconnectAttempts = 0;
            }

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/${encodeURIComponent(room)}/${encodeURIComponent(nickname)}`);

            ws.onopen = function() {
                stopReconnect();
                reconnectAttempts = 0;
                statusBar.textContent = '已连接';
                statusBar.className = 'status-bar connected';
                messageInput.disabled = false;
                sendButton.disabled = false;
                if (!isReconnect) {
                    loadRoomMessages(room);
                }
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'message') {
                    addMessage(data.nickname, data.content, data.timestamp);
                } else if (data.type === 'private_message') {
                    const isTarget = data.target_nickname === currentNickname;
                    const otherUser = isTarget ? data.nickname : data.target_nickname;
                    
                    if (currentRoom === data.private_room) {
                        addMessage(data.nickname, data.content, data.timestamp, true, data.target_nickname);
                    } else {
                        if (isTarget) {
                            showNotification(`${data.nickname} 给你发了私信`);
                        }
                    }
                    loadPrivateRooms();
                } else if (data.type === 'user_list') {
                    updateUserList(data.users);
                } else if (data.type === 'room_user_counts') {
                    updateAllRoomUserCounts(data.counts);
                }
            };

            ws.onclose = function() {
                if (!isManualClose) {
                    statusBar.textContent = '已断开连接，正在尝试重连...';
                    statusBar.className = 'status-bar disconnected';
                    messageInput.disabled = true;
                    sendButton.disabled = true;
                    reconnect();
                } else {
                    statusBar.textContent = '已断开连接';
                    statusBar.className = 'status-bar disconnected';
                    messageInput.disabled = true;
                    sendButton.disabled = true;
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        async function loadRoomMessages(room) {
            try {
                const response = await fetch(`/api/rooms/${encodeURIComponent(room)}/messages`);
                const data = await response.json();
                chatMessages.innerHTML = '';
                data.messages.forEach(msg => {
                    addMessage(msg.nickname, msg.content, msg.timestamp, false, msg.target_nickname);
                });
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        function updateUserList(users) {
            userList.innerHTML = '';
            users.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                userItem.onclick = () => mentionUser(user);
                userItem.innerHTML = `
                    <div class="user-dot"></div>
                    <div class="user-name">${user}</div>
                `;
                userList.appendChild(userItem);
            });
        }

        function updateAllRoomUserCounts(counts) {
            document.querySelectorAll('.room-item').forEach(roomItem => {
                const roomName = roomItem.dataset.room;
                const userCountEl = document.getElementById(`users-${roomName}`);
                if (userCountEl) {
                    const count = counts[roomName] || 0;
                    userCountEl.textContent = `${count} 人在线`;
                }
            });
        }

        function sendMessage() {
            let content = messageInput.value.trim();
            
            if (content && ws && ws.readyState === WebSocket.OPEN) {
                let targetUser = null;
                if (currentRoom && currentRoom.startsWith('private:')) {
                    const parts = currentRoom.split(':');
                    targetUser = parts[1] === currentNickname ? parts[2] : parts[1];
                    if (!content.startsWith('@')) {
                        content = `@${targetUser} ${content}`;
                    }
                }
                ws.send(JSON.stringify({
                    content: content
                }));
                messageInput.value = '';
            }
        }

        function showNotification(message) {
            if (Notification.permission === 'granted') {
                new Notification(message);
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        new Notification(message);
                    }
                });
            }
            console.log(message);
        }

        async function loadPrivateRooms() {
            if (!currentNickname) return;
            
            try {
                const response = await fetch(`/api/users/${encodeURIComponent(currentNickname)}/private-rooms`);
                const data = await response.json();
                const privateRoomList = document.getElementById('privateRoomList');
                
                if (data.private_rooms.length === 0) {
                    privateRoomList.innerHTML = '<div style="color: rgba(255,255,255,0.5); text-align: center; padding: 20px; font-size: 13px;">暂无私人聊天</div>';
                    return;
                }
                
                privateRoomList.innerHTML = '';
                data.private_rooms.forEach(room => {
                    const roomItem = document.createElement('div');
                    roomItem.className = 'room-item private-room-item';
                    roomItem.dataset.room = room.name;
                    roomItem.innerHTML = `
                        <div class="room-item-name">💬 ${room.other_user}</div>
                    `;
                    roomItem.onclick = () => selectPrivateRoom(room.name, room.other_user);
                    privateRoomList.appendChild(roomItem);
                });
            } catch (error) {
                console.error('加载私人房间失败:', error);
            }
        }

        function selectPrivateRoom(roomName, otherUser) {
            if (!currentNickname) {
                alert('请先输入昵称！');
                return;
            }

            document.querySelectorAll('.room-item').forEach(item => {
                item.classList.remove('active');
            });

            const roomItem = document.querySelector(`.private-room-item[data-room="${roomName}"]`);
            if (roomItem) {
                roomItem.classList.add('active');
            }

            currentRoom = roomName;
            currentRoomEl.textContent = `私人聊天: ${otherUser}`;
            connectToRoom(roomName, currentNickname);
        }

        function selectRoom(roomName) {
            if (!currentNickname) {
                alert('请先输入昵称！');
                return;
            }

            document.querySelectorAll('.room-item').forEach(item => {
                item.classList.remove('active');
            });

            const roomItem = document.querySelector(`.room-item[data-room="${roomName}"]`);
            if (roomItem) {
                roomItem.classList.add('active');
            }

            currentRoom = roomName;
            currentRoomEl.textContent = `当前: ${roomName}`;
            connectToRoom(roomName, currentNickname);
        }

        async function createRoom() {
            const roomName = newRoomName.value.trim();
            if (!roomName) {
                alert('请输入房间名称！');
                return;
            }

            try {
                const response = await fetch('/api/rooms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: roomName })
                });
                const data = await response.json();
                
                if (data.success) {
                    newRoomName.value = '';
                    await loadRooms();
                    selectRoom(roomName);
                } else {
                    alert(data.error);
                }
            } catch (error) {
                console.error('创建房间失败:', error);
                alert('创建房间失败');
            }
        }

        async function loadRooms() {
            try {
                const [roomsResponse, countsResponse] = await Promise.all([
                    fetch('/api/rooms'),
                    fetch('/api/rooms/users/counts')
                ]);
                const roomsData = await roomsResponse.json();
                const countsData = await countsResponse.json();
                roomList.innerHTML = '';
                roomsData.rooms.forEach(room => {
                    const roomItem = document.createElement('div');
                    roomItem.className = 'room-item';
                    roomItem.dataset.room = room.name;
                    const userCount = countsData.counts[room.name] || 0;
                    roomItem.innerHTML = `
                        <div class="room-item-name">${room.name}</div>
                        <div class="room-item-users" id="users-${room.name}">${userCount} 人在线</div>
                    `;
                    roomItem.onclick = () => selectRoom(room.name);
                    roomList.appendChild(roomItem);
                });
            } catch (error) {
                console.error('加载房间失败:', error);
            }
        }

        function enterChat() {
            const nickname = welcomeNickname.value.trim();
            if (!nickname) {
                alert('请输入昵称！');
                return;
            }

            if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }

            currentNickname = nickname;
            nicknameInput.value = nickname;
            welcomeScreen.style.display = 'none';
            statusBar.textContent = '请选择一个房间';

            loadPrivateRooms();

            const firstRoom = document.querySelector('.room-item');
            if (firstRoom) {
                selectRoom(firstRoom.dataset.room);
            }
        }

        enterButton.addEventListener('click', enterChat);
        welcomeNickname.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enterChat();
            }
        });

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        createRoomBtn.addEventListener('click', createRoom);
        newRoomName.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                createRoom();
            }
        });

        document.querySelectorAll('.room-item').forEach(item => {
            item.onclick = () => selectRoom(item.dataset.room);
        });
    </script>
</body>
</html>
