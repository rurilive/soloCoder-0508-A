<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 80vh;
            min-height: 500px;
        }

        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #00ff88; }
            50% { opacity: 0.5; box-shadow: 0 0 20px #00ff88; }
        }

        .chat-header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-nickname {
            color: #00d4ff;
            font-weight: 600;
            font-size: 14px;
        }

        .message-time {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 8px;
            color: #e0e0e0;
            line-height: 1.6;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }

        .chat-input-container {
            padding: 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .nickname-input {
            width: 150px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .nickname-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .nickname-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .status-bar {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-align: center;
        }

        .status-bar.connected {
            color: #00ff88;
        }

        .status-bar.disconnected {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <h1>实时聊天室</h1>
        </div>
        <div class="chat-messages" id="chatMessages">
            {% for message in messages %}
            <div class="message">
                <div class="message-header">
                    <span class="message-nickname">{{ message.nickname }}</span>
                    <span class="message-time">{{ message.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</span>
                </div>
                <div class="message-content">{{ message.content }}</div>
            </div>
            {% endfor %}
        </div>
        <div class="chat-input-container">
            <div class="input-group">
                <input type="text" class="nickname-input" id="nickname" placeholder="昵称" maxlength="20">
                <input type="text" class="message-input" id="messageInput" placeholder="输入消息..." maxlength="500">
                <button class="send-button" id="sendButton">发送</button>
            </div>
            <div class="status-bar" id="statusBar">连接中...</div>
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
        
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const nicknameInput = document.getElementById('nickname');
        const sendButton = document.getElementById('sendButton');
        const statusBar = document.getElementById('statusBar');

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.getFullYear() + '-' +
                   String(date.getMonth() + 1).padStart(2, '0') + '-' +
                   String(date.getDate()).padStart(2, '0') + ' ' +
                   String(date.getHours()).padStart(2, '0') + ':' +
                   String(date.getMinutes()).padStart(2, '0') + ':' +
                   String(date.getSeconds()).padStart(2, '0');
        }

        function addMessage(nickname, content, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="message-nickname">${nickname}</span>
                    <span class="message-time">${formatTime(timestamp)}</span>
                </div>
                <div class="message-content">${content}</div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        ws.onopen = function() {
            statusBar.textContent = '已连接';
            statusBar.className = 'status-bar connected';
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            addMessage(data.nickname, data.content, data.timestamp);
        };

        ws.onclose = function() {
            statusBar.textContent = '已断开连接';
            statusBar.className = 'status-bar disconnected';
        };

        function sendMessage() {
            const nickname = nicknameInput.value.trim() || 'Anonymous';
            const content = messageInput.value.trim();
            
            if (content && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    nickname: nickname,
                    content: content
                }));
                messageInput.value = '';
            }
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        scrollToBottom();
    </script>
</body>
</html>
