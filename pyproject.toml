[project]
name = "chatroom"
version = "0.1.0"
description = "Real-time WebSocket Chatroom"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
chatroom = "chatroom.main:app"

[tool.uv]
python-preference = "only-system"
