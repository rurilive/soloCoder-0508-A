{% extends "base.html" %}

{% block title %}添加事件 - 日程管理{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <a href="{{ url_for('calendar.calendar') }}" class="back-btn">&larr; 返回</a>
        <h2>添加新事件</h2>
    </div>
    
    <form method="POST" class="event-form">
        <div class="form-group">
            <label for="title">事件标题 *</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label>事件类型 *</label>
            <div class="event-type-options">
                <label class="event-type-option">
                    <input type="radio" name="event_type" value="single" checked onchange="updateForm()">
                    <span>一次性事件</span>
                </label>
                <label class="event-type-option">
                    <input type="radio" name="event_type" value="cross_day" onchange="updateForm()">
                    <span>跨天事件</span>
                </label>
                <label class="event-type-option">
                    <input type="radio" name="event_type" value="repeat" onchange="updateForm()">
                    <span>重复事件</span>
                </label>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="date">开始日期 *</label>
                <input type="date" id="date" name="date" value="{{ date }}" required>
            </div>
            
            <div class="form-group">
                <label for="time">时间</label>
                <input type="time" id="time" name="time" value="{{ time }}">
            </div>
        </div>
        
        <div class="form-group">
            <label for="duration">持续时间（分钟）</label>
            <input type="number" id="duration" name="duration" min="0" value="0">
        </div>
        
        <div id="cross_day_section" class="form-group" style="display: none;">
            <label for="end_date">结束日期 * (跨天事件)</label>
            <input type="date" id="end_date" name="end_date">
        </div>
        
        <div class="form-group">
            <label>提醒设置</label>
            <div class="reminder-settings">
                <select id="reminder_type" name="reminder_type">
                    <option value="none">不提醒</option>
                    <option value="minutes">分钟前</option>
                    <option value="hours">小时前</option>
                    <option value="days">天前</option>
                </select>
                <input type="number" id="reminder_value" name="reminder_value" min="0" value="0" placeholder="数值">
            </div>
        </div>
        
        <div id="repeat_section" class="form-group" style="display: none;">
            <label>重复设置 *</label>
            <div class="repeat-settings">
                <select id="repeat_type" name="repeat_type">
                    <option value="daily">每天</option>
                    <option value="weekly">每周</option>
                    <option value="monthly">每月</option>
                </select>
                <input type="date" id="repeat_end_date" name="repeat_end_date" placeholder="重复结束日期 *">
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">描述</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存事件</button>
            <a href="{{ url_for('calendar.calendar') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>

<script>
function updateForm() {
    const eventType = document.querySelector('input[name="event_type"]:checked').value;
    const crossDaySection = document.getElementById('cross_day_section');
    const repeatSection = document.getElementById('repeat_section');
    const endDateInput = document.getElementById('end_date');
    const repeatEndDateInput = document.getElementById('repeat_end_date');
    
    crossDaySection.style.display = 'none';
    repeatSection.style.display = 'none';
    endDateInput.removeAttribute('required');
    repeatEndDateInput.removeAttribute('required');
    
    if (eventType === 'cross_day') {
        crossDaySection.style.display = 'block';
        endDateInput.setAttribute('required', 'required');
    } else if (eventType === 'repeat') {
        repeatSection.style.display = 'block';
        repeatEndDateInput.setAttribute('required', 'required');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    updateForm();
});
</script>
{% endblock %}
