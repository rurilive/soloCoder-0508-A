<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}日程管理{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="{{ url_for('calendar') }}">日程管理</a></h1>
            <nav>
                <a href="{{ url_for('calendar') }}">日历</a>
                <a href="{{ url_for('add_event') }}">添加事件</a>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <div id="notificationContainer"></div>
    
    <script>
        let notifiedEvents = new Set();
        
        function checkReminders() {
            fetch('/api/reminders')
                .then(response => response.json())
                .then(reminders => {
                    reminders.forEach(reminder => {
                        if (!notifiedEvents.has(reminder.id)) {
                            showNotification(reminder);
                            notifiedEvents.add(reminder.id);
                        }
                    });
                })
                .catch(error => console.error('Error checking reminders:', error));
        }
        
        function showNotification(reminder) {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <div class="notification-title">🔔 事件提醒</div>
                <div class="notification-content">
                    <strong>${reminder.title}</strong><br>
                    ${reminder.event_date} ${reminder.event_time}
                </div>
                <button class="notification-close" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.remove();
                }
            }, 30000);
        }
        
        checkReminders();
        setInterval(checkReminders, 60000);
    </script>
</body>
</html>
