<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可拖拽排序列表</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            border-color: #667eea;
        }

        .input-section button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
        }

        .list-item:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .list-item.dragging {
            opacity: 0.5;
            transform: rotate(3deg);
        }

        .list-item.drag-over {
            border-color: #667eea;
            border-style: dashed;
            background: #e8ebff;
        }

        .list-item.editing {
            cursor: default;
        }

        .drag-handle {
            font-size: 20px;
            color: #999;
            cursor: grab;
        }

        .item-content {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-word;
        }

        .item-content input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .item-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn {
            background: #ffc107;
            color: #333;
        }

        .edit-btn:hover {
            background: #ffb300;
        }

        .save-btn {
            background: #28a745;
            color: white;
        }

        .save-btn:hover {
            background: #218838;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        .cancel-btn:hover {
            background: #5a6268;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 可拖拽排序列表</h1>
        
        <div class="input-section">
            <input type="text" id="newItemInput" placeholder="输入新列表项..." onkeypress="handleKeyPress(event)">
            <button onclick="addItem()">添加</button>
        </div>

        <ul id="list" class="list"></ul>
    </div>

    <script>
        const STORAGE_KEY = 'draggable_list_items';
        let items = [];
        let dragStartIndex = null;
        let isEditing = false;

        function init() {
            loadFromStorage();
            render();
        }

        function loadFromStorage() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    items = JSON.parse(stored);
                }
            } catch (e) {
                console.error('读取本地存储失败:', e);
                items = [];
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }

        function render() {
            const listElement = document.getElementById('list');
            
            if (items.length === 0) {
                listElement.innerHTML = '<li class="empty-state">暂无列表项，请添加新内容</li>';
                return;
            }

            listElement.innerHTML = items.map((item, index) => `
                <li class="list-item" 
                    data-index="${index}" 
                    draggable="true"
                    ondragstart="handleDragStart(event, ${index})"
                    ondragend="handleDragEnd(event)"
                    ondragover="handleDragOver(event)"
                    ondragleave="handleDragLeave(event)"
                    ondrop="handleDrop(event, ${index})">
                    <span class="drag-handle">☰</span>
                    <div class="item-content" id="content-${index}">
                        ${escapeHtml(item.text)}
                    </div>
                    <div class="item-actions">
                        <button class="edit-btn" onclick="startEdit(${index})">编辑</button>
                        <button class="delete-btn" onclick="deleteItem(${index})">删除</button>
                    </div>
                </li>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addItem() {
            const input = document.getElementById('newItemInput');
            const text = input.value.trim();
            
            if (!text) {
                alert('请输入内容');
                return;
            }

            items = [...items, { id: Date.now(), text }];
            input.value = '';
            saveToStorage();
            render();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addItem();
            }
        }

        function deleteItem(index) {
            if (confirm('确定要删除这个列表项吗？')) {
                items = items.filter((_, i) => i !== index);
                saveToStorage();
                render();
            }
        }

        function startEdit(index) {
            if (isEditing) return;
            
            isEditing = true;
            const listItem = document.querySelector(`[data-index="${index}"]`);
            const contentDiv = document.getElementById(`content-${index}`);
            const actionsDiv = listItem.querySelector('.item-actions');
            const originalText = items[index].text;

            listItem.classList.add('editing');
            listItem.draggable = false;

            contentDiv.innerHTML = `
                <input type="text" id="edit-input-${index}" value="${escapeHtml(originalText)}" onkeypress="handleEditKeyPress(event, ${index})">
            `;

            actionsDiv.innerHTML = `
                <button class="save-btn" onclick="saveEdit(${index})">保存</button>
                <button class="cancel-btn" onclick="cancelEdit(${index}, '${escapeHtml(originalText)}')">取消</button>
            `;

            const editInput = document.getElementById(`edit-input-${index}`);
            editInput.focus();
            editInput.select();
        }

        function handleEditKeyPress(event, index) {
            if (event.key === 'Enter') {
                saveEdit(index);
            }
        }

        function saveEdit(index) {
            const editInput = document.getElementById(`edit-input-${index}`);
            const newText = editInput.value.trim();

            if (!newText) {
                alert('内容不能为空');
                return;
            }

            items = items.map((item, i) => 
                i === index ? { ...item, text: newText } : item
            );
            
            isEditing = false;
            saveToStorage();
            render();
        }

        function cancelEdit(index) {
            isEditing = false;
            render();
        }

        function handleDragStart(event, index) {
            if (isEditing) {
                event.preventDefault();
                return;
            }
            
            dragStartIndex = index;
            event.dataTransfer.effectAllowed = 'move';
            event.target.classList.add('dragging');
        }

        function handleDragEnd(event) {
            event.target.classList.remove('dragging');
            dragStartIndex = null;
            
            const listItems = document.querySelectorAll('.list-item');
            listItems.forEach(item => item.classList.remove('drag-over'));
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        function handleDragLeave(event) {
            event.target.closest('.list-item')?.classList.remove('drag-over');
        }

        function handleDrop(event, targetIndex) {
            event.preventDefault();
            
            if (dragStartIndex === null || dragStartIndex === targetIndex) {
                return;
            }

            const newItems = [...items];
            const [movedItem] = newItems.splice(dragStartIndex, 1);
            newItems.splice(targetIndex, 0, movedItem);
            
            items = newItems;
            saveToStorage();
            render();
        }

        init();
    </script>
</body>
</html>
